<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lanzamientos de la semana</title>
  <link rel="stylesheet" href="/styles/releases.css">
</head>
<body>
  <section id="release-status" class="status" role="status">Cargando los lanzamientos de la semana…</section>
  <article id="release-card" class="card" aria-labelledby="release-title" hidden>
    <div class="art">
      <div class="fallback" aria-hidden="true">NEXT<br>UP<span>GAMES</span></div>
      <img id="release-cover" alt="" hidden decoding="async">
      <div class="art-label"><small>NUEVO LANZAMIENTO</small><strong id="release-art-title"></strong></div>
    </div>
    <div class="content">
      <div class="eyebrow"><span class="category"><i></i>ESTA SEMANA</span><span id="release-position" class="position"></span></div>
      <h1 id="release-title"></h1>
      <p id="release-description" class="description"></p>
      <div class="details">
        <div><span class="label">Lanzamiento</span><time id="release-date"></time></div>
        <div><span class="label">Plataformas · fecha</span><div id="release-platforms" class="platforms"></div></div>
      </div>
      <div class="bottom">
        <div class="source"><span id="release-week"></span><a href="https://www.igdb.com/" target="_blank" rel="noopener noreferrer">Datos: IGDB</a><span id="release-freshness"></span></div>
        <div class="price-block"><span class="label">Precio</span><strong id="release-price"></strong><small>IGDB no proporciona precios</small></div>
      </div>
    </div>
    <div class="accent"></div>
  </article>
  <script src="/scripts/releases.js" type="module"></script>
</body>
</html>
